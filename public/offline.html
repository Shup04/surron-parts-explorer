<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1e23" />
    <meta name="color-scheme" content="dark" />
    <title>Offline · Sur-Ron Parts Explorer</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        background: #141619;
        color: #edf0f3;
        font-family: system-ui, sans-serif;
      }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }
      main {
        width: min(100%, 380px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      h1 {
        margin: 40px 0 12px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      p {
        color: #a0a8b3;
        line-height: 1.65;
        font-size: 15px;
      }
      button {
        min-height: 48px;
        margin-top: 16px;
        padding: 12px 20px;
        border: 0;
        border-radius: 6px;
        background: #8cbbeb;
        color: #152332;
        font:
          600 15px system-ui,
          sans-serif;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 2px solid #edf0f3;
        outline-offset: 4px;
      }
      #connection {
        min-height: 24px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z M4 7.5l8 4.5 8-4.5 M12 12v9" />
        </svg>
        <span>SUR-RON · Parts explorer</span>
      </div>
      <h1>You’re offline</h1>
      <p>
        Reconnect to open the explorer and load the 3D models. Your saved local work stays on this
        device.
      </p>
      <button type="button" id="retry">Try again</button>
      <p id="connection" role="status"></p>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        location.reload();
      });
      window.addEventListener('online', function () {
        document.getElementById('connection').textContent =
          'Connection restored. Try again to continue.';
      });
      window.addEventListener('offline', function () {
        document.getElementById('connection').textContent = '';
      });
    </script>
  </body>
</html>
